<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui;background:#0a0a0f;color:#fff;padding:20px}
.wrap{max-width:640px;margin:0 auto;text-align:center}
a.back{color:#a855f7;text-decoration:none;font-weight:600;display:block;text-align:left}
h1{font-size:clamp(26px,5vw,40px);margin:16px 0 8px}
.sub{color:#9ca3af;margin-bottom:28px}
.card{background:linear-gradient(145deg,#1a1a24,#12121a);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:28px}
input,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:#0a0a0f;color:#fff;font-size:16px;margin-top:12px}
button{margin-top:20px;padding:14px 26px;border:0;border-radius:100px;background:#fff;color:#000;font-weight:700;font-size:15px;cursor:pointer}
button.sec{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.25)}
#qrcode{display:flex;justify-content:center;margin-top:24px;background:#fff;border-radius:16px;padding:20px}
#qrcode img{max-width:100%}
.note{color:#6b7280;font-size:12px;margin-top:20px;line-height:1.6}
</style>

<body>
<div class="wrap">
<a class="back" href="index.html">← Back to THE ONE VAULT</a>
<h1>🔗 QR Generator 3D</h1>
<p class="sub">Premium QR codes for links, text & WiFi. Download HD PNG instantly.</p>
<div class="card">
<input id="text" type="text" placeholder="Paste a link or type any text…" value="https://theonevault.netlify.app">
<select id="size">
<option value="256">Medium — 256 px</option>
<option value="512">Large — 512 px</option>
<option value="1024">HD — 1024 px</option>
</select>
<div>
<button onclick="gen()">Generate QR →</button>
<button class="sec" onclick="download()">Download PNG</button>
</div>
<div id="qrcode"></div>
</div>
<p class="note">QR codes are generated 100% in your browser — nothing you type leaves your device.</p>
</div>
<script>
var qr = null;
function gen(){
  var t = document.getElementById('text').value.trim();
  var s = parseInt(document.getElementById('size').value, 10);
  if (!t){ alert('Please enter a link or text first.'); return; }
  if (typeof QRCode === 'undefined'){ alert('QR library failed to load — check your internet connection and retry.'); return; }
  document.getElementById('qrcode').innerHTML = '';
  qr = new QRCode(document.getElementById('qrcode'), {text: t, width: s, height: s, correctLevel: QRCode.CorrectLevel.M});
}
function download(){
  var img = document.querySelector('#qrcode img') || document.querySelector('#qrcode canvas');
  if (!img){ alert('Generate a QR code first.'); return; }
  var a = document.createElement('a');
  a.download = 'theonevault-qr.png';
  a.href = img.src || img.toDataURL('image/png');
  a.click();
}
window.onload = gen;
</script>
